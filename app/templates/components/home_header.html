<header class="site-header">
    <div class="header-inner">
        <a href="/" class="logo" aria-label="{{ request.state.t('header.home', 'Converigo home') }}">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M14 2L4 8V20L14 26L24 20V8L14 2Z" fill="url(#logoGrad)"/>
                <path d="M11 10L17 14L11 18V10Z" fill="white"/>
                <defs>
                    <linearGradient id="logoGrad" x1="4" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#3FA9F5"/>
                        <stop offset="1" stop-color="#1D4ED8"/>
                    </linearGradient>
                </defs>
            </svg>
            <span>converigo</span>
        </a>

        <nav class="main-nav" role="navigation" aria-label="{{ request.state.t('nav.primary', 'Primary navigation') }}">
            <a href="/tools">{{ request.state.t('nav.tools', 'Alat') }}</a>
            <a href="https://ko-fi.com/converigo" target="_blank" rel="noopener" class="active">{{ request.state.t('nav.support', 'Dukungan') }}</a>
        </nav>

        <div class="header-right">
            <div class="lang-select">
                <span class="lang-icon" aria-hidden="true">🌐</span>
                <span>{{ request.state.t('header.language', 'Bahasa') }}</span>
                <select aria-label="{{ request.state.t('language.selector_label', 'Pilih bahasa') }}" id="languageSelect">
                    {% for locale_code in request.state.supported_locales %}
                        <option value="{{ locale_code }}" {% if request.state.locale.lang_code == locale_code %}selected{% endif %}>{{ locale_code.upper() }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn-mulai" type="button">{{ request.state.t('header.get_started', 'Mulai') }}</button>
        </div>
    </div>
</header>
