<script>
    (function () {
        const safeValue = (value) => {
            if (typeof value !== 'string') {
                return '';
            }
            return value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        };

        const isConverterRoute = () => {
            const path = (window.location.pathname || '').toLowerCase();
            return path.includes('/tools/') || path.includes('/converter/') || path.includes('/convert/');
        };

        const getConverterContext = () => {
            const path = (window.location.pathname || '').toLowerCase();
            const parts = path.split('/').filter(Boolean);
            const slug = parts[parts.length - 1] || '';
            const converterName = slug && slug !== 'tools' && slug !== 'converter' && slug !== 'convert' ? safeValue(slug) : '';
            return {
                converter_name: converterName,
                category: 'converter'
            };
        };

        const normalizeParam = (value) => {
            if (typeof value === 'string') {
                const normalized = safeValue(value);
                return normalized || '';
            }
            if (typeof value === 'number') {
                return String(value);
            }
            return '';
        };

        const normalizeRichParam = (key, value) => {
            if (value === null || value === undefined) {
                return '';
            }
            if (typeof value === 'number') {
                return String(value);
            }
            if (typeof value !== 'string') {
                return normalizeParam(value);
            }

            const trimmed = value.trim();
            if (!trimmed) {
                return '';
            }

            const richKeys = new Set([
                'page_path',
                'page_title',
                'page_location',
                'search_query',
                'link_href',
                'faq_id',
                'metric_name',
                'error_type',
                'event_status',
                'entry_type'
            ]);

            if (richKeys.has(key)) {
                return trimmed.slice(0, 512);
            }

            return normalizeParam(trimmed);
        };

        window.converigoAnalytics = {
            isConverterRoute,
            getConverterContext,
            trackEvent: function (eventName, params) {
                if (!eventName || typeof eventName !== 'string') {
                    return;
                }
                const safeParams = {};
                const allowedKeys = [
                    'converter_name',
                    'category',
                    'input_format',
                    'output_format',
                    'error_type',
                    'event_status',
                    'page_path',
                    'page_title',
                    'page_location',
                    'search_query',
                    'link_href',
                    'faq_id',
                    'metric_name',
                    'metric_value',
                    'entry_type'
                ];
                Object.entries(params || {}).forEach(([key, value]) => {
                    if (allowedKeys.includes(key)) {
                        const normalizedValue = normalizeRichParam(key, value);
                        if (normalizedValue) {
                            safeParams[key] = normalizedValue;
                        }
                    }
                });
                if (window.dataLayer && Array.isArray(window.dataLayer)) {
                    window.dataLayer.push({ event: eventName, ...safeParams });
                }
                if (typeof window.gtag === 'function') {
                    window.gtag('event', eventName, safeParams);
                }
            }
        };
    })();
</script>
